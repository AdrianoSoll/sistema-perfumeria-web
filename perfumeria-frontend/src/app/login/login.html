<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h2>Bienvenido</h2>
      <p>Ingresa tus credenciales para continuar</p>
    </div>

    <div class="login-form">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input 
          type="text" 
          id="username" 
          name="username" 
          placeholder="Ej: admin" 
          [(ngModel)]="credenciales.username">
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          placeholder="********" 
          [(ngModel)]="credenciales.password">
      </div>

      <p *ngIf="mensajeError" style="color: red; font-size: 14px; text-align: center;">
        {{ mensajeError }}
      </p>

      <button type="button" class="btn-login" (click)="iniciarSesion()">Iniciar Sesión</button>
    </div>
  </div>
</div>
